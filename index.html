<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Объекты от собственников Сочи</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231453d8'/%3E%3Cpath d='M14 34 32 18l18 16v14H38V38H26v10H14z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="stylesheet" href="style.css?v=3.4">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
<div id="gate" class="gate"><div class="spinner"></div><p>Загрузка…</p></div>

<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14"/><path d="M14 34 32 18l18 16v14H38V38H26v10H14z"/></svg></span>
      <span><b>Для Агента</b><small>5 минут — вместо тысячи часов!</small></span>
    </div>
    <nav class="menu">
      <button class="link" data-go="favs">★ Избранное</button>
      <button class="link" data-go="sels">📄 Мои подборки</button>
      <button class="link" data-go="admin" id="go-admin" hidden>⚙ Админ</button>
      <span class="who"><span id="who"></span><small id="until"></small></span>
      <button class="link" id="logout" hidden>Выйти</button>
    </nav>
  </header>

  <main>
    <form id="qform" class="search">
      <input id="q" type="search" placeholder="Например: 2к до 15 млн Мамайка не первый" autocomplete="off" enterkeyhint="search">
      <button type="submit" class="btn primary">Найти</button>
      <button type="button" class="btn ghost" id="toggle-f">Фильтры <span id="fcount"></span></button>
    </form>

    <section id="filters" class="filters closed">
      <div class="fgrid">
        <div class="fcell" style="grid-area:kind"><div class="fl">Тип</div><div class="chips" id="f-kind"></div></div>
        <div class="fcell" style="grid-area:rooms"><div class="fl">Комнаты</div><div class="chips" id="f-rooms"></div></div>
        <div class="fcell" style="grid-area:price"><div class="fl">Цена, ₽</div>
          <div class="pair"><input id="pmin" type="text" placeholder="от" inputmode="numeric" autocomplete="off"><span>—</span><input id="pmax" type="text" placeholder="до" inputmode="numeric" autocomplete="off"></div></div>
        <div class="fcell" style="grid-area:area"><div class="fl">Площадь, м²</div>
          <div class="pair"><input id="amin" type="number" min="0" placeholder="от" inputmode="numeric"><span>—</span><input id="amax" type="number" min="0" placeholder="до" inputmode="numeric"></div></div>
        <div class="fcell" style="grid-area:where"><div class="fl">Где</div>
          <div class="chips"><button type="button" class="chip" id="open-areas">📍 Район</button><button type="button" class="chip" id="open-zk">🏢 ЖК</button></div></div>
        <div class="fcell" style="grid-area:floor"><div class="fl">Этаж</div>
          <div class="pair"><input id="fmin" type="number" min="1" placeholder="от" inputmode="numeric"><span>—</span><input id="fmax" type="number" min="1" placeholder="до" inputmode="numeric"></div>
          <div class="checks"><label><input type="checkbox" id="nf"> не первый</label><label><input type="checkbox" id="nl"> не последний</label></div></div>
        <div class="fcell" style="grid-area:fin"><div class="fl">Отделка</div><div class="chips" id="f-fin"></div></div>
        <div class="fcell" style="grid-area:more"><div class="fl">Ещё</div><div class="chips" id="f-flags"></div></div>
      </div>
      <div class="ffoot">
        <label class="sortl">Сортировка
          <select id="sort" aria-label="Сортировка">
            <option value="new">Сначала новые</option>
            <option value="price">Сначала дешевле</option>
            <option value="price_desc">Сначала дороже</option>
            <option value="area_desc">Больше площадь</option>
          </select></label>
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="reset">Сбросить всё</button>
        <button type="button" class="btn primary" id="apply">Показать</button>
      </div>
    </section>

    <div class="bar">
      <p id="status" class="status muted"></p>
      <div class="bar-r">
        <div class="views" id="layouts" title="Сколько объявлений на экране"><button class="seg ic" data-lay="6" title="По 6 на экране">▦ 6</button><button class="seg ic" data-lay="3" title="По 3 в ряд">▥ 3</button><button class="seg ic" data-lay="1" title="По одному, крупно">▭ 1</button></div>
        <div class="views"><button class="seg on" data-view="list">Список</button><button class="seg" data-view="map" id="go-map">Карта</button></div>
      </div>
    </div>

    <section id="list" class="list"></section>
    <button id="more" class="btn more" hidden>Показать ещё</button>
    <div id="map" class="map" hidden></div>
    <section id="maplist" class="maplist" hidden>
      <div class="ml-head"><b id="ml-count"></b>
        <select id="ml-sort" aria-label="Сортировка списка">
          <option value="new">Сначала новые</option><option value="price">Сначала дешевле</option>
          <option value="price_desc">Сначала дороже</option><option value="area_desc">Больше площадь</option>
        </select></div>
      <div id="ml-items" class="ml-items"></div>
      <button id="ml-more" class="btn more" hidden>Показать ещё</button>
    </section>
  </main>

  <footer class="foot">
    <a href="prices.html" target="_blank">Тарифы</a> · <a href="oferta.html" target="_blank">Договор-оферта</a> ·
    <a href="rules.html" target="_blank">Правила</a> · <a href="privacy.html" target="_blank">Политика конфиденциальности</a>
  </footer>

  <div id="selbar" class="selbar" hidden>
    <span id="selcount"></span>
    <button class="btn ghost" id="sel-clear">Очистить</button>
    <button class="btn primary" id="sel-make">Сформировать PDF</button>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-box" role="dialog" aria-modal="true">
    <div class="sheet-head"><b id="sheet-title"></b><button class="x" data-close aria-label="Закрыть">✕</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="viewer" class="viewer" hidden><button class="viewer-close" aria-label="Закрыть">✕</button>
  <button class="viewer-nav l" data-vnav="-1" aria-label="Предыдущее фото">‹</button><button class="viewer-nav r" data-vnav="1" aria-label="Следующее фото">›</button>
  <div class="viewer-strip"></div><div class="viewer-count"></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" defer></script>
<script src="config.js"></script>
<script src="app.js?v=3.4" defer></script>
</body>
</html>
